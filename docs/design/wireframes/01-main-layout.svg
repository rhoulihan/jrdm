<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#E3E0DB" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1440" height="900" fill="#FAF9F7"/>

  <!-- MENU BAR -->
  <rect x="0" y="0" width="1440" height="40" fill="#FFFFFF" stroke="#E3E0DB"/>
  <circle cx="26" cy="20" r="8" fill="#C74634"/>
  <text x="44" y="25" font-size="15" font-weight="700" fill="#1A1A1A">JRDM</text>
  <text x="120" y="25" font-size="14" fill="#1A1A1A">Project ▾</text>
  <text x="210" y="25" font-size="14" fill="#1A1A1A">Connection ▾</text>
  <text x="330" y="25" font-size="14" fill="#1A1A1A">Deploy ▾</text>
  <text x="420" y="25" font-size="14" fill="#1A1A1A">View ▾</text>
  <text x="490" y="25" font-size="14" fill="#1A1A1A">Help ▾</text>

  <!-- TOOLBAR -->
  <rect x="0" y="40" width="1440" height="44" fill="#FAF9F7" stroke="#E3E0DB"/>
  <rect x="16" y="52" width="210" height="22" rx="11" fill="#FFFFFF" stroke="#E3E0DB"/>
  <circle cx="32" cy="63" r="5" fill="#2E7D32"/>
  <text x="44" y="68" font-size="12" fill="#1A1A1A">Connected · SALES@FREEPDB1</text>
  <rect x="240" y="51" width="86" height="24" rx="4" fill="#C74634"/>
  <text x="255" y="67" font-size="12" fill="#FFFFFF">Connect…</text>
  <rect x="334" y="51" width="80" height="24" rx="4" fill="#FFFFFF" stroke="#C74634"/>
  <text x="347" y="67" font-size="12" fill="#C74634">Import…</text>
  <rect x="422" y="51" width="80" height="24" rx="4" fill="#FFFFFF" stroke="#C74634"/>
  <text x="436" y="67" font-size="12" fill="#C74634">Deploy…</text>
  <text x="1180" y="68" font-size="12" fill="#6B6B6B">⊟ fit   ⊞ zoom   ⟲ relayout   ◧ reset split</text>

  <!-- WORKSPACE -->
  <!-- ERD pane -->
  <rect x="0" y="84" width="704" height="724" fill="#FFFFFF"/>
  <rect x="0" y="84" width="704" height="724" fill="url(#grid)" opacity="0.5"/>
  <text x="20" y="108" font-size="13" font-weight="700" fill="#6B6B6B" letter-spacing="1">ERD CANVAS</text>

  <!-- entity card A -->
  <g>
    <rect x="70" y="150" width="210" height="156" rx="6" fill="#FFFFFF" stroke="#E3E0DB" stroke-width="1.5"/>
    <rect x="70" y="150" width="210" height="30" rx="6" fill="#C74634"/>
    <rect x="70" y="166" width="210" height="14" fill="#C74634"/>
    <text x="84" y="170" font-size="13" font-weight="700" fill="#FFFFFF">ORDERS  ⠿</text>
    <text x="84" y="202" font-size="12" fill="#1A1A1A">🔑 id</text>
    <text x="84" y="224" font-size="12" fill="#1A1A1A">customer_id</text>
    <text x="84" y="246" font-size="12" fill="#1A1A1A">order_ts</text>
    <text x="84" y="268" font-size="12" fill="#1A1A1A">status</text>
    <text x="84" y="290" font-size="12" fill="#1A1A1A">total</text>
  </g>
  <!-- entity card B -->
  <g>
    <rect x="380" y="220" width="210" height="134" rx="6" fill="#FFFFFF" stroke="#E3E0DB" stroke-width="1.5"/>
    <rect x="380" y="220" width="210" height="30" rx="6" fill="#C74634"/>
    <rect x="380" y="236" width="210" height="14" fill="#C74634"/>
    <text x="394" y="240" font-size="13" font-weight="700" fill="#FFFFFF">ORDER_ITEMS  ⠿</text>
    <text x="394" y="272" font-size="12" fill="#1A1A1A">🔑 id</text>
    <text x="394" y="294" font-size="12" fill="#1A1A1A">order_id</text>
    <text x="394" y="316" font-size="12" fill="#1A1A1A">sku</text>
    <text x="394" y="338" font-size="12" fill="#1A1A1A">qty</text>
  </g>
  <path d="M280 250 C 330 250 330 285 380 285" fill="none" stroke="#1565C0" stroke-width="2"/>
  <text x="300" y="240" font-size="11" fill="#1565C0">1:N</text>
  <!-- isolated grid hint -->
  <rect x="70" y="380" width="150" height="70" rx="6" fill="#FFFFFF" stroke="#E3E0DB"/>
  <rect x="240" y="380" width="150" height="70" rx="6" fill="#FFFFFF" stroke="#E3E0DB"/>
  <rect x="410" y="380" width="150" height="70" rx="6" fill="#FFFFFF" stroke="#E3E0DB"/>
  <text x="78" y="470" font-size="11" fill="#6B6B6B">isolated tables auto-grid (never a single column)</text>
  <!-- minimap -->
  <rect x="580" y="710" width="104" height="74" rx="4" fill="#FAF9F7" stroke="#E3E0DB"/>
  <text x="592" y="752" font-size="10" fill="#6B6B6B">minimap</text>
  <!-- zoom controls -->
  <rect x="20" y="720" width="34" height="64" rx="6" fill="#FFFFFF" stroke="#E3E0DB"/>
  <text x="33" y="744" font-size="16" fill="#1A1A1A">+</text>
  <text x="34" y="772" font-size="16" fill="#1A1A1A">−</text>

  <!-- SPLITTER -->
  <rect x="704" y="84" width="14" height="724" fill="#FAF9F7" stroke="#E3E0DB"/>
  <rect x="707" y="420" width="8" height="56" rx="4" fill="#C74634"/>
  <text x="690" y="450" font-size="14" fill="#C74634">◀</text>
  <text x="722" y="450" font-size="14" fill="#C74634">▶</text>
  <text x="600" y="828" font-size="11" fill="#6B6B6B">drag the bar to maximize either side · double-click = 50/50 · ◀▶ collapse</text>

  <!-- DOCUMENT pane -->
  <rect x="718" y="84" width="722" height="724" fill="#FFFFFF"/>
  <text x="740" y="108" font-size="13" font-weight="700" fill="#6B6B6B" letter-spacing="1">DOCUMENT CANVAS — orders_dv</text>
  <g font-size="13" fill="#1A1A1A">
    <rect x="760" y="140" width="560" height="34" rx="5" fill="#FAF9F7" stroke="#C74634"/>
    <text x="776" y="162" font-weight="700">▾ orders  (root: ORDERS)</text>
    <text x="800" y="200">• _id  ←  orders.id</text>
    <text x="800" y="228">• status  ←  orders.status</text>
    <text x="800" y="256">• total  ←  orders.total</text>
    <rect x="788" y="276" width="500" height="30" rx="5" fill="#FAF9F7" stroke="#E3E0DB"/>
    <text x="804" y="296" font-weight="700">▾ items  [ array → ORDER_ITEMS ]</text>
    <text x="838" y="332">• sku  ←  order_items.sku</text>
    <text x="838" y="360">• qty  ←  order_items.qty</text>
  </g>
  <rect x="760" y="392" width="560" height="40" rx="6" fill="#FFFFFF" stroke="#E3E0DB" stroke-dasharray="6 4"/>
  <text x="930" y="417" font-size="12" fill="#6B6B6B">drop a column or entity here to add a field</text>
  <rect x="1392" y="720" width="34" height="64" rx="6" fill="#FFFFFF" stroke="#E3E0DB"/>
  <text x="1405" y="744" font-size="16" fill="#1A1A1A">+</text>
  <text x="1406" y="772" font-size="16" fill="#1A1A1A">−</text>

  <!-- BOTTOM DOCK (collapsed) -->
  <rect x="0" y="808" width="1440" height="34" fill="#FAF9F7" stroke="#E3E0DB"/>
  <rect x="16" y="814" width="70" height="22" rx="4" fill="#FFFFFF" stroke="#C74634"/>
  <text x="30" y="829" font-size="12" fill="#C74634">DDL</text>
  <text x="104" y="829" font-size="12" fill="#6B6B6B">Issues</text>
  <text x="166" y="829" font-size="12" fill="#6B6B6B">Deploy Results</text>
  <text x="1360" y="829" font-size="12" fill="#6B6B6B">▴ expand</text>

  <!-- STATUS BAR -->
  <rect x="0" y="842" width="1440" height="58" fill="#FFFFFF" stroke="#E3E0DB"/>
  <text x="16" y="876" font-size="12" fill="#6B6B6B">project: orders_api   ·   view: orders_dv   ·   ERD 100%  ╎  DOC 100%   ·   ✓ valid</text>
  <text x="1230" y="876" font-size="12" fill="#6B6B6B">Inspector ▸ (opens on select)</text>
</svg>
